name: Test C/C++ find_package

# Exercises the find_package(dora-node-api-c) / find_package(dora-node-api-cxx)
# round-trip end-to-end on each platform: cargo build → xtask stage →
# cmake configure → cmake build. Guards #1756's find_package contract.

on:
  push:
    branches: [main]
    paths:
      - "apis/c/**"
      - "apis/c++/**"
      - "xtask/**"
      - "tests/cmake-find-package-c/**"
      - "tests/cmake-find-package-cxx/**"
      - ".github/workflows/test-c-cpp-libraries.yml"
  pull_request:
    paths:
      - "apis/c/**"
      - "apis/c++/**"
      - "xtask/**"
      - "tests/cmake-find-package-c/**"
      - "tests/cmake-find-package-cxx/**"
      - ".github/workflows/test-c-cpp-libraries.yml"
  workflow_dispatch:

jobs:
  find-package-smoke:
    name: find_package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: a
            prefix: lib
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: a
            prefix: lib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: lib
            prefix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2

      # ----- C API: build → stage → cmake configure+build -----
      - name: Build dora-node-api-c
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p dora-node-api-c

      - name: Stage C library
        shell: bash
        run: cargo run -p xtask -- stage dora-node-api-c "target/${{ matrix.target }}/release" dora-c-prefix

      - name: cmake configure + build (C)
        shell: bash
        run: |
          cmake -S tests/cmake-find-package-c -B build-c \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dora-c-prefix"
          cmake --build build-c --config Release

      # ----- C++ API: build → host-cargo bridge files → stage → cmake -----
      - name: Build dora-node-api-cxx
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p dora-node-api-cxx

      - name: Generate host cxxbridge files
        shell: bash
        # Bridge headers/sources are platform-independent and the cxx
        # tool always writes them under `target/<triple>/cxxbridge/`.
        # A host build (no --target) populates `target/cxxbridge/`,
        # which is what xtask falls back to on cross builds.
        run: cargo build --release -p dora-node-api-cxx

      - name: Stage C++ library
        shell: bash
        run: cargo run -p xtask -- stage dora-node-api-cxx "target/${{ matrix.target }}/release" dora-cpp-prefix

      - name: cmake configure + build (C++)
        shell: bash
        run: |
          cmake -S tests/cmake-find-package-cxx -B build-cxx \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dora-cpp-prefix"
          cmake --build build-cxx --config Release
